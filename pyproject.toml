[project]
name = "upp-classification"
version = "0.1.0"
description = "Clasificación de imágenes de úlceras por presión mediante redes neuronales convolucionales"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Yamile Montecinos Rodríguez", email = "yamile.montecinos@uaem.edu.mx"}
]

dependencies = [
    "matplotlib>=3.11.0",
    "mlflow>=3.0.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "optuna-integration>=4.9.0",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"